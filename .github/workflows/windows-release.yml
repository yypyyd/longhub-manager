name: Windows release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version for a manually dispatched build
        required: true
        default: 0.2.15

permissions:
  contents: read

concurrency:
  group: manager-windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/longhub-manager

  package:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.x"
          cache: true
      - name: Resolve and validate release version
        id: version
        shell: pwsh
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          $version = if ($env:RELEASE_REF.StartsWith('refs/tags/v')) {
            $env:RELEASE_REF.Substring('refs/tags/v'.Length)
          } else {
            $env:DISPATCH_VERSION
          }
          if ($version -notmatch '^(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})$') {
            throw 'Release version must be x.y.z'
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress --yes
      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./scripts/build-windows-release.ps1 `
            -Version $env:RELEASE_VERSION `
            -CloudApiBaseUrl 'https://154-9-26-158.sslip.io'
      - name: Verify release boundary and record digest
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $installer = Join-Path $PWD "release/LongHub-Manager-Setup-$env:RELEASE_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw 'Manager installer was not produced'
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'NotSigned') {
            throw "Installer has unexpected Authenticode status: $($signature.Status)"
          }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LongHub-Manager-Setup-$env:RELEASE_VERSION.exe" |
            Set-Content -LiteralPath "$installer.sha256" -Encoding ascii -NoNewline
          if (Test-Path -LiteralPath 'release/artifacts') {
            throw 'Manager release must not contain Cloud artifacts'
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: longhub-manager-${{ steps.version.outputs.value }}-windows
          path: |
            release/LongHub-Manager-Setup-${{ steps.version.outputs.value }}.exe
            release/LongHub-Manager-Setup-${{ steps.version.outputs.value }}.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "GitHub Release already exists and will not be overwritten: $env:RELEASE_TAG"
          }
          $installer = "release/LongHub-Manager-Setup-$env:RELEASE_VERSION.exe"
          $digest = "$installer.sha256"
          gh release create $env:RELEASE_TAG $installer $digest `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title "LongHub Manager $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publication failed'
          }
